name: Prueba self-hosted runner y secrets

on: push

jobs:
  comparar-token:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Comprobar variables
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($null -eq $env:DEV_TOKEN) {
            Write-Host "DEV_TOKEN no está disponible."
          } else {
            Write-Host "DEV_TOKEN está disponible. Longitud: $($env:DEV_TOKEN.Length)"
          }

          if ($null -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "LOCAL_DEV_TOKEN no está disponible."
          } else {
            Write-Host "LOCAL_DEV_TOKEN está disponible. Longitud: $($env:LOCAL_DEV_TOKEN.Length)"
          }

          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden."
          } else {
            Write-Host "Los tokens NO coinciden."
            exit 1
          }