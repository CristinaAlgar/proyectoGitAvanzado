name: CI

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        shell: powershell
        run: |
          Add-Content -Path README.md -Value "Feature: mi-feature"

      - name: Commit README
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar README con mi-feature [skip ci]"
          git push

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DEV token
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ne $env:LOCAL_DEV_TOKEN) {
            Write-Error "DEV_TOKEN no coincide con LOCAL_DEV_TOKEN"
            exit 1
          }

          Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
