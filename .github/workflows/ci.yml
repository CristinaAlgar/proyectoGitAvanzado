name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          echo "Añadida feature: mi-feature" >> README.md

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar README con mi-feature"
          git push

  validate-dev:
    needs: update-readme
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DEV token
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ne $env:LOCAL_DEV_TOKEN) {
            Write-Error "DEV_TOKEN no coincide con LOCAL_DEV_TOKEN"
            exit 1
          }

          Write-Host "DEV_TOKEN coincide con LOCAL_DEV_TOKEN"
