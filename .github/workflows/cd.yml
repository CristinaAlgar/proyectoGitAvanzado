name: CD

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version
        if: github.event_name != 'pull_request'
        run: |
          fecha=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s/AppVersion-[0-9]*/AppVersion-1 - $fecha/" README.md

      - name: Commit README
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar versión de la aplicación [skip ci]"
          git push

      - name: PR check
        if: github.event_name == 'pull_request'
        run: |
          echo "PR hacia main detectada correctamente"

  validate-prod:
    needs: bump-version
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PROD token
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -ne $env:LOCAL_PROD_TOKEN) {
            Write-Error "PROD_TOKEN no coincide con LOCAL_PROD_TOKEN"
            exit 1
          }

          Write-Host "PROD_TOKEN coincide con LOCAL_PROD_TOKEN"
